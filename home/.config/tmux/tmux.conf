# Catppuccin Mocha palette (hardcoded: tmux cannot follow the OS light/dark switch)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g escape-time 10

# Tab-bar-like status line at the top
set -g status-position top
set -g status-justify left
set -g status-style "bg=#313244,fg=#6c7086"
set -g status-left ""
set -g status-right ""
set -g window-status-separator ""
set -g window-status-format "  #I: #W  "
set -g window-status-current-format "  #I: #W  "
set -g window-status-current-style "bg=#f9e2af,fg=#1e1e2e,bold"

# Splits keep the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
